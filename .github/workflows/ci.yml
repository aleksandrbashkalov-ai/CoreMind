name: CoreMind CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Check Swift version (require 6.0+)
      run: |
        version=$(swift --version | head -1 | grep -oE 'version [0-9]+' | grep -oE '[0-9]+')
        echo "Swift version: $(swift --version | head -1)"
        if [ "$version" -lt 6 ]; then
          echo "❌ Swift 6.0+ required, found $version"
          exit 1
        fi
        echo "✅ Swift 6.0+ OK"

    - name: Cache Swift Package Manager
      uses: actions/cache@v6
      with:
        path: |
          .build
          ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Resolve Dependencies
      run: swift package resolve

    - name: Build
      run: swift build -c release

    - name: Run Tests
      run: swift test --parallel

    - name: SwiftLint
      if: hashFiles('.swiftlint.yml') != ''
      run: |
        if command -v swiftlint &> /dev/null; then
          swiftlint lint --strict
        else
          echo "SwiftLint not installed, skipping..."
        fi

  release:
    needs: build-and-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Check Swift version (require 6.0+)
      run: |
        version=$(swift --version | head -1 | grep -oE 'version [0-9]+' | grep -oE '[0-9]+')
        echo "Swift version: $(swift --version | head -1)"
        if [ "$version" -lt 6 ]; then
          echo "❌ Swift 6.0+ required, found $version"
          exit 1
        fi
        echo "✅ Swift 6.0+ OK"

    - name: Build Release
      run: swift build -c release --arch arm64 --arch x86_64

    - name: Create App Bundle
      run: chmod +x scripts/release.sh && ./scripts/release.sh

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: build/CoreMind.app
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
