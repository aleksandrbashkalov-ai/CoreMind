<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
  </defs>

  <!-- Brain shape -->
  <g transform="translate(128, 128)">
    <!-- Left hemisphere -->
    <ellipse cx="-25" cy="-5" rx="38" ry="50" fill="none" stroke="url(#g)" stroke-width="4"/>
    <!-- Right hemisphere -->
    <ellipse cx="25" cy="-5" rx="38" ry="50" fill="none" stroke="url(#g)" stroke-width="4"/>
    <!-- Center line -->
    <line x1="0" y1="-55" x2="0" y2="45" stroke="url(#g)" stroke-width="2" opacity="0.5"/>

    <!-- Neural connections -->
    <circle cx="-25" cy="-35" r="4" fill="#e94560"/>
    <circle cx="0" cy="-45" r="4" fill="#f5a623"/>
    <circle cx="25" cy="-30" r="4" fill="#e94560"/>
    <circle cx="-20" cy="5" r="3.5" fill="#f5a623"/>
    <circle cx="20" cy="10" r="3.5" fill="#e94560"/>
    <circle cx="-10" cy="22" r="3" fill="#f5a623"/>
    <circle cx="10" cy="28" r="3" fill="#e94560"/>

    <!-- Connection lines -->
    <line x1="-25" y1="-35" x2="0" y2="-45" stroke="#e94560" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="-45" x2="25" y2="-30" stroke="#f5a623" stroke-width="1.5" opacity="0.5"/>
    <line x1="-25" y1="-35" x2="-20" y2="5" stroke="#f5a623" stroke-width="1.5" opacity="0.5"/>
    <line x1="25" y1="-30" x2="20" y2="10" stroke="#e94560" stroke-width="1.5" opacity="0.5"/>
    <line x1="-20" y1="5" x2="-10" y2="22" stroke="#e94560" stroke-width="1.5" opacity="0.5"/>
    <line x1="20" y1="10" x2="10" y2="28" stroke="#f5a623" stroke-width="1.5" opacity="0.5"/>

    <!-- Brain stem -->
    <rect x="-5" y="45" width="10" height="18" rx="5" fill="url(#g)" opacity="0.6"/>
  </g>
</svg>
